<div class="card p-4">
    <h2 class="text-xl font-bold mb-3">⌚ 智慧手環健康數據</h2>
    <div class="mb-4">
        <label class="block font-medium mb-1">心率 (Heart Rate):</label>
        <input type="number" id="band_heart_rate" placeholder="例如：75" class="border p-2 rounded w-full">
    </div>
    <div class="mb-4">
        <label class="block font-medium mb-1">血氧 (SpO2 %):</label>
        <input type="number" id="band_spo2" placeholder="例如：98" class="border p-2 rounded w-full">
    </div>
    <div class="mb-4">
        <label class="block font-medium mb-1">今日步數:</label>
        <input type="number" id="band_steps" placeholder="例如：5000" class="border p-2 rounded w-full">
    </div>
    <div class="mb-4">
        <label class="block font-medium mb-1">近期平均步數:</label>
        <input type="number" id="band_avg_steps" placeholder="例如：6000" class="border p-2 rounded w-full">
    </div>
</div>
