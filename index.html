<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HeadacheV12</title>
    
    <!-- 1. 載入 Supabase SDK & Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- 2. 載入共用設定檔 -->
    <script src="./config.js"></script>
    <script src="./i18n.js"></script>
    <script src="./districts.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="top-toolbar">
    <button class="lang-btn" onclick="toggleLanguage()">🌐 中/En</button>
</div>
fetch('https://headache0811.nslabtmu.workers.dev/api/save')
<!-- 1. 同意書卡片 -->
<div class="card card-left" id="consent-card">
    <h2 data-i18n="consent_title" style="margin-top:0;">📄 研究參與同意書</h2>
    <div id="consent-update-notice" class="hidden" style="background:#fff3cd; color:#856404; border:1px solid #ffeeba; border-radius:6px; padding:12px 15px; margin-bottom:15px; font-size:14px; line-height:1.6;"></div>
    
    <p style="font-size: 14px; color: #666;" data-i18n="consent_desc">請詳細閱讀以下研究說明與同意書內容：</p>
    
    <iframe class="pdf-container" id="pdfFrame"></iframe>
    <p style="text-align: center; font-size: 13px; margin-top: 5px;">
        若無法正常顯示 PDF，請 <a id="pdfDownloadLink" href="#" target="_blank" style="color: #3498db;">點此在新分頁開啟閱讀</a>
    </p>
    <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn" style="background-color: #e74c3c; flex: 1;" onclick="disagreeConsent()">不同意參與</button>
        <button class="btn" style="background-color: #27ae60; flex: 1;" onclick="agreeConsent()" data-i18n="consent_agree_btn">我已閱讀並同意參與研究</button>
    </div>
</div>

<!-- 2. Google 登入卡片 -->
<div class="card hidden" id="auth-card">
    <h2 data-i18n="login_title">🔐 系統登入</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 20px;" data-i18n="login_desc">請使用 Google 帳號授權登入以開始記錄</p>
    <button class="btn google-btn" onclick="handleGoogleLogin()">
        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
        <span data-i18n="google_login_btn">使用 Google 帳號快速登入</span>
    </button>
</div>

<!-- 3. 主表單卡片 -->
<div class="card card-left hidden" id="main-card">
    
    <div id="user-info-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div class="user-menu" style="position: relative;">
            <button class="btn btn-sm" onclick="toggleUserMenu()">👤 帳號 ⋯</button>
            <div id="user-dropdown" class="hidden" style="position:absolute; right:0; top:110%; background:var(--color-card-bg); border:1px solid var(--color-border); border-radius:8px; box-shadow:var(--shadow-card); min-width:200px; z-index:1000;">
                <div class="dropdown-account" style="padding:10px 14px; font-size:12px; color:var(--color-text-muted); border-bottom:1px solid var(--color-border);">
                    登入帳號：<br><span id="user-email" style="color:var(--color-text-main); font-weight:500;">載入中...</span>
                </div>
                <button id="resetConsentBtn" class="dropdown-item" onclick="resetConsent()">📄 重填同意書</button>
                <button class="dropdown-item" onclick="handleLogout()">🚪 登出</button>
            </div>
        </div>
    </div>

    <h2 data-i18n="form_title" style="margin: 0 0 10px 0;">📝 頭痛日誌</h2>  
 
    <!-- 氣象狀態與位置提示區塊 (動態載入) -->
    <div id="pane-weather" class="mb-4"></div>
   
    <!-- 手機版下拉選單與頁簽按鈕 -->
    <select class="tabs-select-mobile" onchange="switchTab(this.value)" id="mobile-tab-select">
        <option value="headache" data-i18n="tab_headache">🤕 頭痛紀錄</option>
        <option value="symptom" data-i18n="tab_symptom">📝 相關症狀</option>
        <option value="band" data-i18n="tab_band">⌚ 健康資料</option>
        <option value="chart" data-i18n="tab_chart">📈 趨勢圖表</option>
        <option value="profile" data-i18n="tab_profile">👤 個人基本資料</option>
    </select>

    <div class="tabs">
        <button class="tab-btn" id="btn-tab-headache" onclick="switchTab('headache')" data-i18n="tab_headache">🤕 頭痛紀錄</button>
        <button class="tab-btn" id="btn-tab-symptom" onclick="switchTab('symptom')" data-i18n="tab_symptom">📝 相關症狀</button>
        <button class="tab-btn" id="btn-tab-band" onclick="switchTab('band')" data-i18n="tab_band">⌚ 健康資料</button>
        <button class="tab-btn" id="btn-tab-chart" onclick="switchTab('chart')" data-i18n="tab_chart">📈 趨勢圖表</button>
        <button class="tab-btn" id="btn-tab-profile" onclick="switchTab('profile')" data-i18n="tab_profile">👤 個人基本資料</button>
    </div>

    <form id="attack-form" onsubmit="event.preventDefault(); saveFullRecord();">
        <!-- 各個分頁內容由外部 HTML 透過 fetch 填入 -->
        <div id="pane-headache" class="tab-pane"></div>
        <div id="pane-symptoms" class="tab-pane hidden"></div>
        <div id="pane-band" class="tab-pane hidden"></div>
        <div id="pane-chart" class="tab-pane hidden"></div>
        <div id="pane-profile" class="tab-pane hidden"></div>
    </form>
</div>

<!-- 自動動態載入各個分頁 HTML 的腳本 -->
<script>
    async function loadPanes() {
        try {
            const loadFile = async (id, path) => {
                const el = document.getElementById(id);
                if (el) {
                    const res = await fetch(path);
                    el.innerHTML = await res.text();
                }
            };
            await loadFile('pane-weather', 'panes/weather.html');
            await loadFile('pane-headache', 'panes/headache.html');
            await loadFile('pane-symptoms', 'panes/symptoms.html');
            await loadFile('pane-band', 'panes/band.html');
            await loadFile('pane-chart', 'panes/chart.html');
            await loadFile('pane-profile', 'panes/profile.html');
            console.log("✅ 所有頁籤 HTML 動態載入成功！");
        } catch (err) {
            console.error("❌ 載入頁籤 HTML 失敗：", err);
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        await loadPanes();
    });
</script>

<!-- 主邏輯程式碼 -->
<script src="./main.js"></script>

</body>
</html>
