<!DOCTYPE html>
<html lang="zh-TW">
<head>
<!-- 1. 載入 Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- 2. 載入共用設定檔 -->
<script src="./config.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HeadacheV5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="lang-btn" onclick="toggleLanguage()">🌐 中/En</button>

    <!-- 1. 同意書卡片 (最先顯示) -->
    <div class="card card-left" id="consent-card">
        <h2 data-i18n="consent_title" style="margin-top:0;">📄 研究參與同意書</h2>
        <p style="font-size: 14px; color: #666;" data-i18n="consent_desc">請詳細閱讀以下研究說明與同意書內容：</p>
        
        <!-- 內嵌 PDF 檔案：請將 src 換成你的 PDF 網址或檔案路徑 -->
        <iframe src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" class="pdf-container" id="pdfFrame"></iframe>
        
        <button class="btn" onclick="agreeConsent()" data-i18n="consent_agree_btn">我已閱讀並同意參與研究</button>
    </div>

    <!-- 2. Google 登入卡片 (同意後顯示) -->
    <div class="card hidden" id="auth-card">
        <h2 data-i18n="login_title">🔐 系統登入</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;" data-i18n="login_desc">請使用 Google 帳號授權登入以開始記錄</p>
        <button class="btn google-btn" onclick="handleGoogleLogin()">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
            <span data-i18n="google_login_btn">使用 Google 帳號快速登入</span>
        </button>
    </div>

    <!-- 3. 主表單卡片 -->
    <div class="card card-left hidden" id="main-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 data-i18n="form_title" style="margin: 0;">📝 頭痛與環境研究日誌</h2>
            <button onclick="handleLogout()" style="background:#e74c3c; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;" data-i18n="logout_btn">登出</button>
        </div>

        <!-- 頁簽切換按鈕群組 -->
        <div class="tabs">
            <button class="tab-btn active" id="btn-tab-profile" onclick="switchTab('profile')" data-i18n="tab_profile">👤 個人基本資料</button>
            <button class="tab-btn" id="btn-tab-symptom" onclick="switchTab('symptom')" data-i18n="tab_symptom">📝 症狀與環境</button>
            <button class="tab-btn" id="btn-tab-band" onclick="switchTab('band')" data-i18n="tab_band">⌚ 健康手環</button>
        </div>
        
        <div id="weather-status" data-i18n="weather_loading">⏳ 正在取得您的位置與即時 29 項氣象及空污數據...</div>

        <!-- 頁簽 1：個人基本資料 -->
        <div id="pane-profile" class="form-group">
            <h3 data-i18n="profile_heading" style="margin-top:0; color:#2980b9;">基本資料設定</h3>
            <div class="form-group">
                <label data-i18n="prof_name">1. 暱稱（非必填）</label>
                <input type="text" id="prof_nickname" placeholder="例如: 王小明 / Alex">
            </div>
            <div class="form-group">
                <label data-i18n="prof_birth">2. 出生年 (西元)</label>
                <input type="number" id="prof_birthyear" placeholder="例如: 1990">
            </div>
            <div class="form-group">
                <label data-i18n="prof_gender">3. 性別</label>
                <select id="prof_gender">
                    <option value="" data-i18n="select_default">請選擇...</option>
                    <option value="male" data-i18n="gender_male">男性</option>
                    <option value="female" data-i18n="gender_female">女性</option>
                    <option value="other" data-i18n="gender_other">其他 / 不願透露</option>
                </select>
            </div>
            <div class="form-group">
                <label data-i18n="prof_tbi">4. 是否參與輕度腦外傷研究</label>
                <select id="prof_tbi">
                    <option value="yes" data-i18n="yes">是</option>
                    <option value="no" data-i18n="no">否</option>
                </select>
            </div>
            <div class="form-group">
                <label data-i18n="prof_sport">5. 運動頻率</label>
                <select id="prof_sport">
                    <option value="none" data-i18n="sport_none">幾乎不運動</option>
                    <option value="light" data-i18n="sport_light">輕度（每周 1-2 次）</option>
                    <option value="moderate" data-i18n="sport_moderate">中度（每周 3-4 次）</option>
                    <option value="heavy" data-i18n="sport_heavy">規律高強度（每周 5 次以上）</option>
                </select>
            </div>
            <button class="btn" onclick="saveAllResearchData()" data-i18n="save_profile_btn">儲存個人基本資料</button>
        </div>

        <!-- 醫療緊急警示防錯區 (僅在症狀頁顯示) -->
        <div class="emergency-box" id="emergency-section" style="display:none;">
            <h3 data-i18n="emg_title" style="color: #c0392b; margin-top: 0;">⚠️ 醫療緊急警示</h3>
            <p data-i18n="emg_desc" style="font-size: 14px; margin: 0;">若您或觀察對象目前出現以下任何狀況，請<b>立即停止填表並即刻撥打 119 送醫</b>：</p>
            <div style="margin-top: 8px; font-size: 14px; line-height: 1.6;">
                <input type="checkbox" id="emg_1" class="emg-check" onchange="checkEmergency()"> <label style="display:inline;" for="emg_1" data-i18n="emg_1">昏睡叫不醒、意識嚴重改變</label><br>
                <input type="checkbox" id="emg_2" class="emg-check" onchange="checkEmergency()"> <label style="display:inline;" for="emg_2" data-i18n="emg_2">劇烈頭痛或持續性嘔吐</label><br>
                <input type="checkbox" id="emg_3" class="emg-check" onchange="checkEmergency()"> <label style="display:inline;" for="emg_3" data-i18n="emg_3">四肢抽搐或癲癇發作</label><br>
                <input type="checkbox" id="emg_4" class="emg-check" onchange="checkEmergency()"> <label style="display:inline;" for="emg_4" data-i18n="emg_4">肢體突然單側無力、手腳發麻</label><br>
                <input type="checkbox" id="emg_5" class="emg-check" onchange="checkEmergency()"> <label style="display:inline;" for="emg_5" data-i18n="emg_5">視力模糊、複視（疊影）</label>
            </div>
            <div id="emergencyWarning" class="warning-text" data-i18n="warning_text">
                🚨 偵測到重大危險徵象！請勿填表，請立即前往最近的急診室就醫評估！
            </div>   
        </div>

        <form id="attack-form" onsubmit="event.preventDefault(); saveAttackForm();">
            
            <!-- 頁簽 2：10 大症狀填寫區 -->
            <div id="pane-symptom" class="hidden">
                <div class="form-group"><label data-i18n="sym_1">1. 持續性頭痛</label><div class="slider-container"><input type="range" name="sym1" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_2">2. 頭暈、失去平衡或步態不穩</label><div class="slider-container"><input type="range" name="sym2" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_3">3. 噁心、想吐的感覺</label><div class="slider-container"><input type="range" name="sym3" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_4">4. 疲勞感、睡眠過多或嗜睡</label><div class="slider-container"><input type="range" name="sym4" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_5">5. 注意力難以集中、記憶變差</label><div class="slider-container"><input type="range" name="sym5" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_6">6. 反應變慢、思考模糊/腦霧</label><div class="slider-container"><input type="range" name="sym6" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_7">7. 易怒、焦慮、情緒波動或性格改變</label><div class="slider-container"><input type="range" name="sym7" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_8">8. 視力模糊、對光線或噪音極度敏感</label><div class="slider-container"><input type="range" name="sym8" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_9">9. 睡眠障礙、失眠或入睡困難</label><div class="slider-container"><input type="range" name="sym9" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_10">10. 頸部疼痛、麻木或微弱抽動</label><div class="slider-container"><input type="range" name="sym10" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>

                <div class="form-group">
                    <label for="triggers" data-i18n="triggers_label">記錄日常誘因（如：使用3C、特定活動會使症狀加重嗎？）：</label>
                    <textarea id="triggers" name="triggers" rows="3" placeholder="請描述使您感到不舒服的活動或環境..."></textarea>
                </div>
                <button type="submit" class="btn" id="submitBtn" data-i18n="submit_btn">送出今日症狀日記</button>
            </div>

            <!-- 頁簽 3：健康手環資料區 -->
            <div id="pane-band" class="hidden">
                <div class="form-group">
                    <label data-i18n="band_hr">❤️ 即時心跳 (bpm)</label>
                    <input type="number" id="band_heart_rate" placeholder="例如: 75">
                </div>
                <div class="form-group">
                    <label data-i18n="band_spo2">🩸 血氧飽和度 SpO2 (%)</label>
                    <input type="number" id="band_spo2" placeholder="例如: 98">
                </div>
                <div class="form-group">
                    <label data-i18n="band_steps">👟 今日步數 (步)</label>
                    <input type="number" id="band_steps" placeholder="例如: 6500">
                </div>
                <div class="form-group">
                    <label data-i18n="band_avg_steps">📊 近期平均步數 (步/日)</label>
                    <input type="number" id="band_avg_steps" placeholder="例如: 7200">
                </div>
                <button type="button" class="btn" onclick="saveBandData()" data-i18n="submit_band_btn">送出手環數據</button>
            </div>

        </form>
    </div>

    <!-- 圖表展示卡片 -->
    <div class="card hidden" id="chart-card">
        <h3 data-i18n="chart_title">📈 近期持續性頭痛趨勢</h3>
        <canvas id="painChart"></canvas>
    </div>

<script>
    const REQUIRE_LOCATION_FOR_SUBMIT = false; //如果要鎖定位置要改true

    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentWeather = null;

            warning_text: '🚨 偵測到重大危險徵象！請勿填表，請立即前往最近的急診室就醫評估！',

            prof_tbi: '4. Participating in Mild TBI Study', prof_sport: '5. Exercise Frequency', select_default: 'Select...',
            gender_male: 'Male', gender_female: 'Female', gender_other: 'Other / Prefer not to say', yes: 'Yes', no: 'No',

    function toggleLanguage() {
        currentLang = (currentLang === 'zh-TW') ? 'en' : 'zh-TW';
        document.documentElement.lang = currentLang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (langDict[currentLang][key]) {
                el.innerHTML = langDict[currentLang][key];
            }
        });
    }

    // 點擊同意書後進入登入畫面
    function agreeConsent() {
        document.getElementById('consent-card').classList.add('hidden');
        document.getElementById('auth-card').classList.remove('hidden');
    }

    function switchTab(tabName) {
        const paneProfile = document.getElementById('pane-profile');
        const paneSymptom = document.getElementById('pane-symptom');
        const paneBand = document.getElementById('pane-band');
        
        const btnProfile = document.getElementById('btn-tab-profile');
        const btnSymptom = document.getElementById('btn-tab-symptom');
        const btnBand = document.getElementById('btn-tab-band');
        const emergencySection = document.getElementById('emergency-section');

        // 全部隱藏
        paneProfile.classList.add('hidden');
        paneSymptom.classList.add('hidden');
        paneBand.classList.add('hidden');
        btnProfile.classList.remove('active');
        btnSymptom.classList.remove('active');
        btnBand.classList.remove('active');
        emergencySection.style.display = 'none';

        if (tabName === 'profile') {
            paneProfile.classList.remove('hidden');
            btnProfile.classList.add('active');
        } else if (tabName === 'symptom') {
            paneSymptom.classList.remove('hidden');
            btnSymptom.classList.add('active');
            emergencySection.style.display = 'block';
        } else if (tabName === 'band') {
            paneBand.classList.remove('hidden');
            btnBand.classList.add('active');
        }
    }

    supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) {
            // 如果已登入，直接跳過同意書與登入，進入主畫面
            document.getElementById('consent-card').classList.add('hidden');
            document.getElementById('auth-card').classList.add('hidden');
            showMainApp(session.user);
        }
    });

    async function handleGoogleLogin() {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.href }
        });
        if (error) alert("Google 登入失敗：" + error.message);
    }

    async function handleLogout() {
        await supabase.auth.signOut();
        location.reload(); // 重新整理回到同意書
    }

    function showMainApp(user) {
        document.getElementById('main-card').classList.remove('hidden');
        document.getElementById('chart-card').classList.remove('hidden');
        getLocationAndWeather();
        loadUserProfile(user.id);
        loadUserHistory(user.id);
    }
async function startResearchFlow() {
    // 步驟 1：基本資料 (必填或預設已填)

    async function loadUserProfile(userId) {
        const { data } = await supabase.from('profiles').select('*').eq('user_id', userId).single();
        if (data) {
            document.getElementById('prof_nickname').value = data.nickname || '';
            document.getElementById('prof_birthyear').value = data.birth_year || '';

    function getLocationAndWeather() {
        const statusEl = document.getElementById('weather-status');
        if (!navigator.geolocation) { fetchIpLocation(statusEl); return; }
        navigator.geolocation.getCurrentPosition(
            (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude, "GPS 定位成功"),
            () => fetchIpLocation(statusEl),
            { timeout: 8000 }
        );
    }

    async function fetchIpLocation(statusEl) {
        try {
            statusEl.innerText = "⏳ 正在透過網路 IP 進行定位...";
            const res = await fetch('https://ipapi.co/json/');
            const ipData = await res.json();
            if (ipData.latitude && ipData.longitude) {
                fetchWeather(ipData.latitude, ipData.longitude, `IP 定位成功 (${ipData.city || '未知城市'})`);
            } else { throw new Error(); }
        } catch (err) {
            statusEl.innerText = "⚠️ 無法取得位置資訊";
            locationReady = false;
        }
    }

async function fetchWeather(lat, lon, successMsg) {
    const statusEl = document.getElementById('weather-status');
    try {
        // 15 項氣象參數
        const weatherParams = [
            'temperature_2m','relative_humidity_2m','apparent_temperature','is_day',
            'precipitation','rain','showers','snowfall','weather_code','cloud_cover',
            'pressure_msl','surface_pressure','wind_speed_10m','wind_direction_10m','wind_gusts_10m'
        ].join(',');

        // 14 項空污參數
        const airParams = [
            'pm10','pm2_5','carbon_monoxide','nitrogen_dioxide','sulphur_dioxide','ozone',
            'aerosol_optical_depth','dust','uv_index','uv_index_clear_sky',
            'ammonia','methane','european_aqi','us_aqi'
        ].join(',');

        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=${weatherParams}`;
        const airUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=${airParams}`;

        const [weatherRes, airRes] = await Promise.all([
            fetch(weatherUrl),
            fetch(airUrl)
        ]);
        const weatherData = await weatherRes.json();
        const airData = await airRes.json();

        currentWeather = {
            lat, lon,
            fetched_at: new Date().toISOString(),
            weather: weatherData.current || {},
            air_quality: airData.current || {}
        };
        locationReady = true;
        statusEl.innerHTML = `📍 ${successMsg}！氣象與空污數據同步完成`;
    } catch (err) {
        statusEl.innerText = "⚠️ 氣象資料解析失敗";
        currentWeather = { lat, lon, fetched_at: new Date().toISOString(), weather: {}, air_quality: {} };
        locationReady = true;
    }
}
    function updateVal(slider) { slider.nextElementSibling.innerText = slider.value; }

    function checkEmergency() {
        const checkboxes = document.querySelectorAll('.emg-check');
        const warningBox = document.getElementById('emergencyWarning');
        const submitBtn = document.getElementById('submitBtn');
        let isChecked = false;
        checkboxes.forEach(cb => { if (cb.checked) isChecked = true; });
        if (isChecked) { warningBox.style.display = 'block'; submitBtn.disabled = true; }
        else { warningBox.style.display = 'none'; submitBtn.disabled = false; }
    }

    async function saveAttackForm() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { alert("請先登入！"); return; }

        const symptoms = {};
        for (let i = 1; i <= 10; i++) {
            const slider = document.querySelector(`input[name="sym${i}"]`);
            if (slider) symptoms[`sym_${i}`] = Number(slider.value);
        }

        const newRecord = {
            user_id: user.id,
            user_email: user.email,
            symptoms: symptoms,
            triggers: document.getElementById('triggers').value.trim() || "無",
            weather: currentWeather || { note: "未取得" }
        };

        const { error } = await supabase.from('user_data').insert([newRecord]);
        if (error) alert("❌ 儲存失敗：" + error.message);
        else { alert("✅ 症狀日記送出成功！"); loadUserHistory(user.id); }
    }

    async function loadUserHistory(userId) {
        const { data } = await supabase.from('user_data').select('*').eq('user_id', userId).order('created_at', { ascending: true }).limit(30);
        if (!data) return;
        const labels = data.map(item => new Date(item.created_at).toLocaleDateString());
        const painScores = data.map(item => item.symptoms?.sym_1 || 0);

        const ctx = document.getElementById('painChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{ label: '頭痛評分趨勢 (Sym 1)', data: painScores, borderColor: '#3498db', backgroundColor: 'rgba(52, 152, 219, 0.1)', borderWidth: 2, fill: true }]
            },
            options: { responsive: true, scales: { y: { min: 1, max: 10 } } }
        });
    }

async function saveAllResearchData() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { alert("請先登入！"); return; }

    // 1. 打包個人基本資料 JSONB
    const profileData = {
        nickname: document.getElementById('prof_nickname').value.trim(),
        birth_year: Number(document.getElementById('prof_birthyear').value) || null,
        gender: document.getElementById('prof_gender').value,
        tbi_study: document.getElementById('prof_tbi').value,
        sport_freq: document.getElementById('prof_sport').value
    };

    // 2. 打包 10 大症狀與誘因 JSONB (你可以把症狀也放進 health 或獨立，這裡示範放一起或另外開)
    const symptomsData = {};
    for (let i = 1; i <= 10; i++) {
        const slider = document.querySelector(`input[name="sym${i}"]`);
        if (slider) symptomsData[`sym_${i}`] = Number(slider.value);
    }
    symptomsData.triggers = document.getElementById('triggers').value.trim() || "無";

    // 3. 打包手環健康數據 JSONB (包含未來想加的新欄位也可以直接塞在這裡)
    const healthData = {
        heart_rate: Number(document.getElementById('band_heart_rate').value) || null,
        spo2: Number(document.getElementById('band_spo2').value) || null,
        steps: Number(document.getElementById('band_steps').value) || null,
        avg_steps: Number(document.getElementById('band_avg_steps').value) || null
        // 💡 未來想加新欄位？直接在這裡加即可，例如： sleep_hours: 7
    };

    // 4. 組合最終要送進資料庫的 Payload
    const payload = {
        user_id: user.id,
        user_email: user.email,
        profile_data: profileData,
        symptoms_data: symptomsData, // 包含症狀
        health_data: healthData,     // 包含手環
        weather_data: currentWeather || { note: "未取得" } // 氣象
    };

    // 5. 寫入 Supabase 的 user_data 資料表
    const { error } = await supabase.from('user_data').insert([payload]);

    if (error) {
        alert("❌ 儲存失敗：" + error.message);
    } else {
        alert("✅ 今日研究日誌與數據已成功送出！");
    }
}
