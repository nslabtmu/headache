<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Headache & Environment Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 10px; background-color: #f8f9fa; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .lang-btn { position: fixed; top: 10px; right: 10px; z-index: 1000; padding: 5px 10px; border-radius: 20px; border: 1px solid #ddd; background: white; cursor: pointer; font-weight: bold; }
        
        /* 頁簽樣式 */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e0e0e0; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        .tab-btn.active { background: #3498db; color: white; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="password"], input[type="number"], textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        .btn { background: #3498db; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #2980b9; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .emergency-box { background: #fff5f5; border: 2px solid #e74c3c; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .warning-text { display: none; color: #c0392b; font-weight: bold; margin-top: 10px; text-align: center; background: #fadbd8; padding: 10px; border-radius: 6px; }
        .slider-container { display: flex; align-items: center; gap: 15px; }
        input[type="range"] { flex: 1; height: 40px; }
        .slider-val { font-weight: bold; min-width: 25px; text-align: center; color: #2980b9; }
        .hidden { display: none; }
        #weather-status { font-size: 13px; color: #555; background: #e8f4f8; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <button class="lang-btn" onclick="toggleLanguage()">🌐 中/En</button>

    <!-- 登入卡片 -->
    <div class="card hidden" id="auth-card">
        <h2 data-i18n="login_title">🔐 系統登入 / 註冊</h2>
        <div class="form-group">
            <label data-i18n="email_label">電子郵件</label>
            <input type="text" id="email" placeholder="Email">
        </div>
        <div class="form-group">
            <label data-i18n="pwd_label">密碼</label>
            <input type="password" id="password" placeholder="Password">
        </div>
        <button class="btn" onclick="handleAuth('login')" data-i18n="login_btn">登入</button>
        <button class="btn" style="background: #2ecc71; margin-top: 10px;" onclick="handleAuth('signup')" data-i18n="signup_btn">註冊帳號</button>
    </div>

    <!-- 主表單卡片 -->
    <div class="card hidden" id="main-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 data-i18n="form_title" style="margin: 0;">📝 頭痛與環境日誌</h2>
            <button onclick="handleLogout()" style="background:#e74c3c; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;" data-i18n="logout_btn">登出</button>
        </div>

        <!-- 頁簽切換按鈕群組 -->
        <div class="tabs">
            <button class="tab-btn active" id="btn-tab-symptom" onclick="switchTab('symptom')" data-i18n="tab_symptom">📝 症狀與環境</button>
            <button class="tab-btn" id="btn-tab-band" onclick="switchTab('band')" data-i18n="tab_band">⌚ 健康手環資料</button>
        </div>
        
        <div id="weather-status" data-i18n="weather_loading">⏳ 正在取得您的位置與即時 29 項氣象及空污數據...</div>

        <!-- 醫療緊急警示防錯區 -->
        <div class="emergency-box" id="emergency-section">
            <h3 data-i18n="emg_title" style="color: #c0392b; margin-top: 0;">⚠️ 醫療緊急警示</h3>
            <p data-i18n="emg_desc" style="font-size: 14px; margin: 0;">若您或觀察對象目前出現以下任何狀況，請<b>立即停止填表並即刻撥打 119 送醫</b>：</p>
            <div style="margin-top: 8px; font-size: 14px; line-height: 1.6;">
                <input type="checkbox" id="emg_1" class="emg-check" onchange="checkEmergency()"> <label style="display:inline;" for="emg_1" data-i18n="emg_1">昏睡叫不醒、意識嚴重改變</label><br>
                <input type="checkbox" id="emg_2" class="emg-check" onchange="checkEmergency()"> <label style="display:inline;" for="emg_2" data-i18n="emg_2">劇烈頭痛或持續性嘔吐</label><br>
                <input type="checkbox" id="emg_3" class="emg-check" onchange="checkEmergency()"> <label style="display:inline;" for="emg_3" data-i18n="emg_3">四肢抽搐或癲癇發作</label><br>
                <input type="checkbox" id="emg_4" class="emg-check" onchange="checkEmergency()"> <label style="display:inline;" for="emg_4" data-i18n="emg_4">肢體突然單側無力、手腳發麻</label><br>
                <input type="checkbox" id="emg_5" class="emg-check" onchange="checkEmergency()"> <label style="display:inline;" for="emg_5" data-i18n="emg_5">視力模糊、複視（疊影）</label>
            </div>
            <div id="emergencyWarning" class="warning-text" data-i18n="warning_text">
                🚨 偵測到重大危險徵象！請勿填表，請立即前往最近的急診室就醫評估！
            </div>   
        </div>

        <form id="attack-form" onsubmit="event.preventDefault(); saveAttackForm();">
            
            <!-- 頁簽 1：10 大症狀填寫區 -->
            <div id="pane-symptom">
                <div class="form-group"><label data-i18n="sym_1">1. 持續性頭痛</label><div class="slider-container"><input type="range" name="sym1" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_2">2. 頭暈、失去平衡或步態不穩</label><div class="slider-container"><input type="range" name="sym2" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_3">3. 噁心、想吐的感覺</label><div class="slider-container"><input type="range" name="sym3" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_4">4. 疲勞感、睡眠過多或嗜睡</label><div class="slider-container"><input type="range" name="sym4" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_5">5. 注意力難以集中、記憶變差</label><div class="slider-container"><input type="range" name="sym5" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_6">6. 反應變慢、思考模糊/腦霧</label><div class="slider-container"><input type="range" name="sym6" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_7">7. 易怒、焦慮、情緒波動或性格改變</label><div class="slider-container"><input type="range" name="sym7" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_8">8. 視力模糊、對光線或噪音極度敏感</label><div class="slider-container"><input type="range" name="sym8" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_9">9. 睡眠障礙、失眠或入睡困難</label><div class="slider-container"><input type="range" name="sym9" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>
                <div class="form-group"><label data-i18n="sym_10">10. 頸部疼痛、麻木或微弱抽動</label><div class="slider-container"><input type="range" name="sym10" min="1" max="10" value="1" oninput="updateVal(this)"><span class="slider-val">1</span></div></div>

                <div class="form-group">
                    <label for="triggers" data-i18n="triggers_label">記錄日常誘因（如：使用3C、特定活動會使症狀加重嗎？）：</label>
                    <textarea id="triggers" name="triggers" rows="3" placeholder="請描述使您感到不舒服的活動或環境..."></textarea>
                </div>
            </div>

            <!-- 頁簽 2：健康手環資料區 -->
            <div id="pane-band" class="hidden">
                <div class="form-group">
                    <label data-i18n="band_hr">❤️ 即時心跳 (bpm)</label>
                    <input type="number" id="band_heart_rate" placeholder="例如: 75">
                </div>
                <div class="form-group">
                    <label data-i18n="band_spo2">🩸 血氧飽和度 SpO2 (%)</label>
                    <input type="number" id="band_spo2" placeholder="例如: 98">
                </div>
                <div class="form-group">
                    <label data-i18n="band_steps">👟 今日步數 (步)</label>
                    <input type="number" id="band_steps" placeholder="例如: 6500">
                </div>
                <div class="form-group">
                    <label data-i18n="band_avg_steps">📊 近期平均步數 (步/日)</label>
                    <input type="number" id="band_avg_steps" placeholder="例如: 7200">
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn" data-i18n="submit_btn" style="margin-top: 15px;">送出完整日記與數據</button>
        </form>
    </div>

    <!-- 圖表展示卡片 -->
    <div class="card hidden" id="chart-card">
        <h3 data-i18n="chart_title">📈 近期持續性頭痛趨勢</h3>
        <canvas id="painChart"></canvas>
    </div>

<script>
    // ==========================================
    // ⚙️ 系統參數設定區
    // ==========================================
    // 若改設為 true，則「沒有抓到位置/氣象」時會直接禁止送出表單！
    // 若維持 false，則允許沒有位置也能送出資料。
    const REQUIRE_LOCATION_FOR_SUBMIT = false; 
    // ==========================================

    const SUPABASE_URL = 'https://ligckapfksiyvcvsppde.supabase.co/';
    const SUPABASE_ANON_KEY = 'sb_publishable_oDFhgWFOd80vTh8FFanFrw_6Z243ThZ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentWeather = null;
    let chartInstance = null;
    let currentLang = 'zh-TW';
    let locationReady = false;

    const langDict = {
        'zh-TW': {
            login_title: '🔐 系統登入 / 註冊', email_label: '電子郵件', pwd_label: '密碼', login_btn: '登入', signup_btn: '註冊帳號',
            form_title: '📝 頭痛與環境研究日誌', logout_btn: '登出',
            tab_symptom: '📝 症狀與環境', tab_band: '⌚ 健康手環資料',
            weather_loading: '⏳ 正在取得您的位置與即時 29 項氣象及空污數據...',
            emg_title: '⚠️ 醫療緊急警示',
            emg_desc: '若您或觀察對象目前出現以下任何狀況，請<b>立即停止填表並即刻撥打 119 送醫</b>：',
            emg_1: '昏睡叫不醒、意識嚴重改變', emg_2: '劇烈頭痛或持續性嘔吐', emg_3: '四肢抽搐或癲癇發作', emg_4: '肢體突然單側無力、手腳發麻', emg_5: '視力模糊、複視（疊影）',
            warning_text: '🚨 偵測到重大危險徵象！請勿填表，請立即前往最近的急診室就醫評估！',
            sym_1: '1. 持續性頭痛', sym_2: '2. 頭暈、失去平衡或步態不穩', sym_3: '3. 噁心、想吐的感覺', sym_4: '4. 疲勞感、睡眠過多或嗜睡', sym_5: '5. 注意力難以集中、記憶變差', sym_6: '6. 反應變慢、思考模糊/腦霧', sym_7: '7. 易怒、焦慮、情緒波動或性格改變', sym_8: '8. 視力模糊、對光線或噪音極度敏感', sym_9: '9. 睡眠障礙、失眠或入睡困難', sym_10: '10. 頸部疼痛、麻木或微弱抽動',
            triggers_label: '記錄日常誘因（如：使用3C、特定活動會使症狀加重嗎？）：',
            band_hr: '❤️ 即時心跳 (bpm)', band_spo2: '🩸 血氧飽和度 SpO2 (%)', band_steps: '👟 今日步數 (步)', band_avg_steps: '📊 近期平均步數 (步/日)',
            submit_btn: '送出完整日記與數據',
            chart_title: '📈 近期持續性頭痛趨勢'
        },
        'en': {
            login_title: '🔐 Login / Sign Up', email_label: 'Email', pwd_label: 'Password', login_btn: 'Login', signup_btn: 'Sign Up',
            form_title: '📝 Headache & Environment Journal', logout_btn: 'Logout',
            tab_symptom: '📝 Symptom & Environment', tab_band: '⌚ Smart Band Data',
            weather_loading: '⏳ Fetching location & 29 weather/air quality parameters...',
            emg_title: '⚠️ Medical Emergency Warning',
            emg_desc: 'If you or the patient experience any of the following, <b>stop filling out the form and call 119 immediately</b>:',
            emg_1: 'Unresponsiveness, altered consciousness', emg_2: 'Severe headache or persistent vomiting', emg_3: 'Seizures or convulsions', emg_4: 'Sudden unilateral weakness or numbness', emg_5: 'Blurred vision or double vision',
            warning_text: '🚨 Critical danger signs detected! Do not submit, seek emergency medical care immediately!',
            sym_1: '1. Persistent Headache', sym_2: '2. Dizziness, balance issues or unstable gait', sym_3: '3. Nausea or vomiting sensation', sym_4: '4. Fatigue, hypersomnia or lethargy', sym_5: '5. Difficulty concentrating, memory impairment', sym_6: '6. Slowed reactions, brain fog / confusion', sym_7: '7. Irritability, anxiety, mood swings', sym_8: '8. Blurred vision, extreme sensitivity to light/noise', sym_9: '9. Sleep disturbances, insomnia', sym_10: '10. Neck pain, numbness or mild twitching',
            triggers_label: 'Record daily triggers (e.g., 3C usage, specific activities):',
            band_hr: '❤️ Heart Rate (bpm)', band_spo2: '🩸 SpO2 (%)', band_steps: '👟 Today Steps', band_avg_steps: '📊 Average Daily Steps',
            submit_btn: 'Submit Complete Journal & Data',
            chart_title: '📈 Recent Persistent Headache Trend'
        }
    };

    function toggleLanguage() {
        currentLang = (currentLang === 'zh-TW') ? 'en' : 'zh-TW';
        document.documentElement.lang = currentLang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (langDict[currentLang][key]) {
                el.innerHTML = langDict[currentLang][key];
            }
        });
    }

    // 頁簽切換功能
    function switchTab(tabName) {
        const paneSymptom = document.getElementById('pane-symptom');
        const paneBand = document.getElementById('pane-band');
        const btnSymptom = document.getElementById('btn-tab-symptom');
        const btnBand = document.getElementById('btn-tab-band');
        const emergencySection = document.getElementById('emergency-section');

        if (tabName === 'symptom') {
            paneSymptom.classList.remove('hidden');
            paneBand.classList.add('hidden');
            btnSymptom.classList.add('active');
            btnBand.classList.remove('active');
            emergencySection.style.display = 'block'; // 症狀頁才顯示醫療警示
        } else {
            paneSymptom.classList.add('hidden');
            paneBand.classList.remove('hidden');
            btnSymptom.classList.remove('active');
            btnBand.classList.add('active');
            emergencySection.style.display = 'none'; // 手環頁隱藏警示，讓版面乾淨
        }
    }

    supabase.auth.getSession().then(async ({ data: { session } }) => {
        if (session) {
            showMainApp(session.user);
        } else {
            document.getElementById('auth-card').classList.remove('hidden');
        }
    });

    async function handleAuth(action) {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        if(!email || !password) { alert("請輸入 Email 與密碼"); return; }

        let res;
        if(action === 'login') {
            res = await supabase.auth.signInWithPassword({ email, password });
        } else {
            res = await supabase.auth.signUp({ email, password });
            alert("註冊成功！若有啟用 Email 驗證請先收信，或可直接登入。");
        }

        if(res.error) {
            alert("錯誤：" + res.error.message);
        } else if(res.data.session) {
            showMainApp(res.data.session.user);
        }
    }

    async function handleLogout() {
        await supabase.auth.signOut();
        document.getElementById('main-card').classList.add('hidden');
        document.getElementById('chart-card').classList.add('hidden');
        document.getElementById('auth-card').classList.remove('hidden');
    }

    function showMainApp(user) {
        document.getElementById('auth-card').classList.add('hidden');
        document.getElementById('main-card').classList.remove('hidden');
        document.getElementById('chart-card').classList.remove('hidden');
        getLocationAndWeather();
        loadUserHistory(user.id);
    }

    function getLocationAndWeather() {
        const statusEl = document.getElementById('weather-status');
        
        if (!navigator.geolocation) {
            fetchIpLocation(statusEl);
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                fetchWeather(position.coords.latitude, position.coords.longitude, "GPS 定位成功");
            }, 
            (error) => {
                fetchIpLocation(statusEl);
            },
            { timeout: 8000 }
        );
    }

    async function fetchIpLocation(statusEl) {
        try {
            statusEl.innerText = "⏳ 正在透過網路 IP 進行定位...";
            const res = await fetch('https://ipapi.co/json/');
            const ipData = await res.json();
            
            if (ipData.latitude && ipData.longitude) {
                fetchWeather(ipData.latitude, ipData.longitude, `IP 定位成功 (${ipData.city || '未知城市'})`);
            } else {
                throw new Error("IP 定位失敗");
            }
        } catch (err) {
            statusEl.innerText = "⚠️無法取得位置資訊";
            locationReady = false;
            checkLocationRestriction();
        }
    }

    async function fetchWeather(lat, lon, successMsg) {
        const statusEl = document.getElementById('weather-status');
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,dew_point_2m,apparent_temperature,precipitation,rain,snowfall,pressure_msl,surface_pressure,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,visibility,weather_code&air_quality=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone,european_aqi,us_aqi,dust,alder_pollen,birch_pollen,grass_pollen,olive_pollen`;
            
            const response = await fetch(url);
            const data = await response.json();

            currentWeather = { lat: lat, lon: lon, fetched_at: new Date().toISOString(), full_data: data };
            locationReady = true;

            const currentTemp = data.current?.temperature_2m ?? '未知';
            const currentPressure = data.current?.surface_pressure ?? '未知';
            statusEl.innerHTML = `📍 ${successMsg}！已同步即時環境 29 項指標 (氣溫: ${currentTemp}°C, 氣壓: ${currentPressure} hPa)`;
        } catch (err) {
            statusEl.innerText = "⚠️ 氣象資料解析失敗";
            currentWeather = { lat, lon, fetched_at: new Date().toISOString(), full_data: {} };
            locationReady = true; // 有經緯度就算成功
        }
        checkLocationRestriction();
    }

    // 參數防錯控管機制
    function checkLocationRestriction() {
        if (REQUIRE_LOCATION_FOR_SUBMIT && !locationReady) {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerText = "❌ 必須取得位置才能送出";
        }
    }

    function updateVal(slider) {
        slider.nextElementSibling.innerText = slider.value;
    }

    function checkEmergency() {
        const checkboxes = document.querySelectorAll('.emg-check');
        const warningBox = document.getElementById('emergencyWarning');
        const submitBtn = document.getElementById('submitBtn');
        let isChecked = false;

        checkboxes.forEach(cb => { if (cb.checked) isChecked = true; });

        if (isChecked) {
            warningBox.style.display = 'block';
            submitBtn.disabled = true;
        } else {
            warningBox.style.display = 'none';
            if (!(REQUIRE_LOCATION_FOR_SUBMIT && !locationReady)) {
                submitBtn.disabled = false;
            }
        }
    }

    async function saveAttackForm() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { alert("請先登入！"); return; }

        if (REQUIRE_LOCATION_FOR_SUBMIT && !locationReady) {
            alert("⚠️ 尚未取得位置資訊，無法送出表單！");
            return;
        }

        // 收集 10 大症狀
        const symptoms = {};
        for (let i = 1; i <= 10; i++) {
            const slider = document.querySelector(`input[name="sym${i}"]`);
            if (slider) symptoms[`sym_${i}`] = Number(slider.value);
        }

        const triggersText = document.getElementById('triggers').value.trim();

        // 收集健康手環資料
        const smartBandData = {
            heart_rate: Number(document.getElementById('band_heart_rate').value) || null,
            spo2: Number(document.getElementById('band_spo2').value) || null,
            steps: Number(document.getElementById('band_steps').value) || null,
            avg_steps: Number(document.getElementById('band_avg_steps').value) || null
        };

        const newRecord = {
            user_id: user.id,
            user_email: user.email,
            symptoms: symptoms,
            triggers: triggersText !== "" ? triggersText : "無特別備註",
            smart_band: smartBandData, // 包含心跳、血氧、步數
            weather: currentWeather || { note: "未取得氣象與定位" }
        };

        const { error } = await supabase.from('user_data').insert([newRecord]);

        if (error) {
            alert("❌ 儲存失敗：" + error.message);
        } else {
            alert("✅ 成功新增一筆完整日記與數據！");
            document.getElementById('triggers').value = "";
            document.getElementById('band_heart_rate').value = "";
            document.getElementById('band_spo2').value = "";
            document.getElementById('band_steps').value = "";
            document.getElementById('band_avg_steps').value = "";
            loadUserHistory(user.id);
        }
    }

    async function loadUserHistory(userId) {
        const { data, error } = await supabase
            .from('user_data')
            .select('*')
            .eq('user_id', userId)
            .order('created_at', { ascending: true })
            .limit(30);

        if (error || !data) return;

        const labels = data.map(item => new Date(item.created_at).toLocaleDateString());
        const painScores = data.map(item => item.symptoms?.sym_1 || 0);

        const ctx = document.getElementById('painChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '持續性頭痛評分趨勢 (Sym 1)',
                    data: painScores,
                    borderColor: '#3498db',
                    backgroundColor: 'rgba(52, 152, 219, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { min: 1, max: 10 }
                }
            }
        });
    }
</script>
</body>
</html>
