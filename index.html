<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>頭痛與氣象研究系統</title>
    <!-- Tailwind CSS 或你的樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6" data-active-tab="headache">

    <!-- 頂部導覽列與登入狀態 -->
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded shadow">
        <div>
            <span id="user-email" class="font-bold">載入中...</span>
        </div>
        <button onclick="handleLogout()" class="bg-red-500 text-white px-4 py-2 rounded text-sm">登出</button>
    </div>

    <!-- 主要內容區塊：用空容器預留位置，載入時動態填入 -->
    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- 頁籤 1：天氣 (對應 pane-weather) -->
        <div id="pane-weather" class="tab-pane"></div>

        <!-- 頁籤 2：頭痛紀錄 (對應 pane-headache) -->
        <div id="pane-headache" class="tab-pane hidden"></div>

        <!-- 頁籤 3：症狀 (對應 pane-symptoms) -->
        <div id="pane-symptoms" class="tab-pane hidden"></div>

        <!-- 頁籤 4：健康資料 (對應 pane-band) -->
        <div id="pane-band" class="tab-pane hidden"></div>

        <!-- 頁籤 5：趨勢圖表 (對應 pane-chart) -->
        <div id="pane-chart" class="tab-pane hidden"></div>

        <!-- 統一送出按鈕 -->
        <button onclick="saveFullRecord()" class="w-full bg-blue-600 text-white font-bold p-3 rounded shadow hover:bg-blue-700">
            ✅ 送出今日完整研究紀錄
        </button>
    </div>

    <!-- 載入 Supabase 與 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 自動動態載入各個頁籤 HTML 的腳本 -->
    <script>
        async function loadPanes() {
            try {
                document.getElementById('pane-weather').innerHTML = await (await fetch('panes/weather.html')).text();
                document.getElementById('pane-headache').innerHTML = await (await fetch('panes/headache.html')).text();
                document.getElementById('pane-symptoms').innerHTML = await (await fetch('panes/symptoms.html')).text();
                document.getElementById('pane-band').innerHTML = await (await fetch('panes/band.html')).text();
                document.getElementById('pane-chart').innerHTML = await (await fetch('panes/chart.html')).text();
                console.log("✅ 所有頁籤 HTML 載入成功！");
            } catch (err) {
                console.error("❌ 載入頁籤 HTML 失敗：", err);
            }
        }

        // 在 DOM 載入完成前先抓 HTML，確保後續 JS 能抓到DOM元素
        window.addEventListener('DOMContentLoaded', async () => {
            await loadPanes();
        });
    </script>

    <!-- 載入你原本寫好的 main.js 邏輯 -->
    <script src="main.js"></script>
</body>
</html>
