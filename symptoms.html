<div class="card p-4">
    <h2 class="text-xl font-bold mb-3">🩺 伴隨症狀與誘發因素</h2>
    
    <!-- 範例：前兩項症狀滑桿 -->
    <div class="mb-4">
        <label class="block font-medium mb-1">疲勞程度: <span id="sym1-val">0</span></label>
        <input type="range" name="sym1" min="0" max="10" value="0" class="w-full" oninput="updateVal(this)">
    </div>
    <div class="mb-4">
        <label class="block font-medium mb-1">暈眩程度: <span id="sym2-val">0</span></label>
        <input type="range" name="sym2" min="0" max="10" value="0" class="w-full" oninput="updateVal(this)">
    </div>

    <div class="mb-4">
        <label class="block font-medium mb-1">可能的誘發因素：</label>
        <input type="text" id="triggers" placeholder="例如：睡眠不足、壓力大、氣溫驟降" class="border p-2 rounded w-full">
    </div>
</div>
