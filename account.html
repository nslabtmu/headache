<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號管理面板 - HeadacheV12</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>   <!-- 加這行，順序要在下面你的自訂 script 之前 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "微軟正黑體", Arial, sans-serif;
            background: #f5f6f7;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 24px;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #ecf0f1;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #1976d2;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1565c0;
            line-height: 1.6;
        }

        .section {
            margin-bottom: 32px;
        }

        .section h2 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 16px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        input {
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 13px;
            font-family: "Microsoft YaHei", Arial;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(52, 152, 219, 0.3);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-reset {
            background: #f39c12;
            color: white;
        }

        .btn-reset:hover {
            background: #d68910;
        }

        .message {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            border-left: 4px solid;
        }

        .message.error {
            background: #ffe5e5;
            color: #c0392b;
            border-color: #c0392b;
            display: block;
        }

        .message.success {
            background: #e8f8f5;
            color: #27ae60;
            border-color: #27ae60;
            display: block;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #ecf0f1;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
            color: #34495e;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-disabled {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .code {
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 16px;
        }

        .modal-body {
            margin-bottom: 16px;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-cancel {
            background: #95a5a6;
            color: white;
        }

        .btn-cancel:hover {
            background: #7f8c8d;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ecf0f1;
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .table-wrapper {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 帳號管理面板</h1>

<a href="index.html" class="btn btn-primary" style="display:inline-block; text-decoration:none; margin-bottom:20px;">
    ← 回到記錄頁面
</a>
        <div class="info-box">
            💡 <strong>說明：</strong> 此面板用於管理帳號密碼登入的用戶（老人家等）。Google 登入的用戶自動管理。
        </div>

        <!-- 統計卡片 -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-users">0</div>
                <div class="stat-label">總帳號數</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <div class="stat-number" id="active-users">0</div>
                <div class="stat-label">活躍帳號</div>
            </div>
        </div>

        <!-- 新增帳號 -->
        <div class="section">
            <h2>➕ 新增帳號（一鍵建立）</h2>

            <div id="add-message" class="message"></div>

            <form onsubmit="handleAddUser(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="add-name">姓名 *</label>
                        <input type="text" id="add-name" placeholder="例如：王老先生" required>
                    </div>

                    <div class="form-group">
                        <label for="add-account">帳號 *</label>
                        <input type="text" id="add-account" placeholder="例如：wang-001" required>
                    </div>

                    <div class="form-group">
                        <label for="add-password">密碼 *</label>
                        <input type="password" id="add-password" placeholder="例如：12345678" required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span id="add-btn-text">新增</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- 帳號列表 -->
        <div class="section">
            <h2>👥 帳號列表</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>帳號</th>
                            <th>狀態</th>
                            <th>建立時間</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #95a5a6;">載入中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 重置密碼 Modal -->
    <div id="reset-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">重置密碼</div>
            <div id="reset-message" class="message"></div>
            
            <form onsubmit="handleResetPassword(event)">
                <div class="modal-body">
                    <p style="font-size: 12px; color: #34495e; margin-bottom: 12px;">
                        帳號：<span class="code" id="reset-account"></span>
                    </p>

                    <div class="form-group" style="margin-bottom: 12px;">
                        <label for="reset-password">新密碼 *</label>
                        <input type="password" id="reset-password" placeholder="輸入新密碼" required>
                    </div>

                    <div class="form-group">
                        <label for="reset-password-confirm">確認密碼 *</label>
                        <input type="password" id="reset-password-confirm" placeholder="再次輸入" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" onclick="closeResetModal()">取消</button>
                    <button type="submit" class="btn btn-reset">確認重置</button>
                </div>
            </form>
        </div>
    </div>

<!-- 編輯用戶 Modal -->
<div id="edit-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">編輯用戶</div>
        
        <form onsubmit="handleEditUser(event)">
            <div class="modal-body">
                <!-- 原有的欄位 -->
                <div class="form-group">
                    <label for="edit-name">姓名</label>
                    <input type="text" id="edit-name">
                </div>
 
                <div class="form-group">
                    <label for="edit-password">新密碼（留空不變更）</label>
                    <input type="password" id="edit-password">
                </div>
 
                <!-- 新增：音樂療法設定 -->
                <div style="border-top: 1px solid #ecf0f1; margin: 16px 0; padding: 16px 0;">
                    <h4 style="font-size: 14px; color: #2c3e50; margin-bottom: 12px;">
                        🎵 音樂療法設定
                    </h4>
 
                    <div class="form-group">
                        <label for="edit-music-mode">模式</label>
                        <select 
                            id="edit-music-mode" 
                            onchange="updateMusicOptionsVisibility()"
                            style="width: 100%; padding: 8px; border: 1px solid #bdc3c7;"
                        >
                            <option value="free">自由選擇（用戶可自由選擇音樂）</option>
                            <option value="locked">鎖定指定（用戶只能聽指定音樂）</option>
                        </select>
                    </div>
 
                    <!-- 只在 locked 模式時顯示 -->
                    <div id="music-options-group" style="display: none;">
                        <label>鎖定的音樂</label>
                        <select 
                            id="edit-preferred-music"
                            style="width: 100%; padding: 8px; border: 1px solid #bdc3c7;"
                        >
                            <option value="純鋼琴">🎹 純鋼琴</option>
                            <option value="森林">🌲 森林</option>
                            <option value="海洋">🌊 海洋</option>
                        </select>
                    </div>
                </div>
 
                <!-- 原有的欄位 -->
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="edit-status">
                        停用此帳號
                    </label>
                </div>
            </div>
 
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeEditModal()">取消</button>
                <button type="submit" class="btn btn-primary">儲存</button>
            </div>
        </form>
    </div>
</div>
 
    <script src="./account.js"></script>
</body>
</html>
