<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號與研究管理面板 - HeadacheV12</title>
    <!-- 1. 外部與共用套件 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>   <!-- 載入 Supabase 設定 -->
    <!-- 2. 載入獨立的 account.css 樣式表 -->
    <link rel="stylesheet" href="account.css">
</head>
<body>
    <div class="container">
        <h1>🔐 帳號與研究管理面板</h1>

        <a href="index.html" class="btn btn-primary" style="display:inline-block; text-decoration:none; margin-bottom:20px;">
            ← 回到記錄頁面
        </a>
        
        <div class="info-box">
            💡 <strong>說明：</strong> 此面板用於管理帳號密碼登入的用戶（如老人家等），並可針對受試者設定音樂治療研究方案（3個月期程與 LINE 每日自動提醒）。
        </div>

        <!-- 統計卡片 -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-users">0</div>
                <div class="stat-label">總帳號數</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <div class="stat-number" id="active-users">0</div>
                <div class="stat-label">活躍帳號</div>
            </div>
        </div>
<!-- 🌟 分頁導覽列按鈕 -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('tab-users', this)">👥 帳號與研究清單</button>
            <button class="tab-btn" onclick="switchTab('tab-add', this)">➕ 新增帳號</button>
            <button class="tab-btn" onclick="switchTab('tab-music', this)">🎵 音樂清單管理</button>
            <button class="tab-btn" onclick="switchTab('tab-audit', this)">🧾 異動紀錄</button>
        </div>
        
        <!-- 新增帳號 -->
        <div id="tab-add" class="tab-content">
        <div class="section">
            <h2>➕ 新增帳號（一鍵建立）</h2>
            <div id="add-message" class="message"></div>

            <form onsubmit="handleAddUser(event)">
                <div class="form-row">
                    <div class="form-group">
                      <label for="add-tbi">TBI 帳號</label>
                      <input type="text" id="add-tbi" placeholder="例如 m1111、c1111，無則填 NA" pattern="[mMcC][0-9]+|[Nn][Aa]" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="add-name">姓名 *</label>
                        <input type="text" id="add-name" placeholder="例如：王老先生" required>
                    </div>

                    <div class="form-group">
                        <label for="add-account">帳號 *</label>
                        <input type="text" id="add-account" placeholder="例如：wang-001" required>
                    </div>

                    <div class="form-group">
                        <label for="add-password">密碼 *</label>
                        <input type="password" id="add-password" placeholder="例如：12345678" required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span id="add-btn-text">新增</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
 <!-- 🌟 分頁 3：音樂清單管理 -->
        <div id="tab-music" class="tab-content">       
<div class="section">
    <h2>🎵 音樂清單管理</h2>
    <div id="music-message" class="message"></div>

    <form onsubmit="handleAddMusic(event)">
        <div class="form-row">
            <div class="form-group"><label>代碼 *（小寫英數底線，如 rain）</label><input id="mt-key" required pattern="[a-z0-9_]+"></div>
            <div class="form-group"><label>名稱 *（如 🌧️ 雨聲）</label><input id="mt-name" required></div>
            <div class="form-group"><label>英文名稱</label><input id="mt-name-en"></div>
            <div class="form-group"><label>YouTube 網址 *</label><input id="mt-url" required></div>
            <div class="form-group"><label>說明</label><input id="mt-desc"></div>
            <div class="form-group">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                    <input type="checkbox" id="mt-add-locked" style="width:18px;height:18px;">
                    <span>同時加給所有「只顯示勾選」的受試者</span>
                </label>
            </div>
            <button type="submit" class="btn btn-primary">新增音樂</button>
        </div>
    </form>

    <div class="table-wrapper">
        <table>
            <thead><tr><th>代碼</th><th>名稱</th><th>YouTube 網址</th><th>啟用</th><th>操作</th></tr></thead>
            <tbody id="music-table"></tbody>
        </table>
    </div>
</div>
 </div>   
<!-- 🌟 分頁 1：帳號與研究清單 (預設顯示) -->
        <div id="tab-users" class="tab-content active">
        <div class="section">
            <h2>👥 帳號與研究清單</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>帳號</th>
                            <th>TBI 帳號</th>
                            <th>狀態</th>
                            <th>音樂分組 / 狀態</th>
                            <th>建立時間</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <tr>
                            <td colspan="7" style="text-align: center; color: #95a5a6;">載入中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
         </div>
<!-- 🌟 分頁 4：異動紀錄 -->
        <div id="tab-audit" class="tab-content">
        <div class="section">
    <h2>🧾 異動紀錄（最近 50 筆）</h2>
    <div class="table-wrapper">
        <table>
            <thead><tr><th>時間</th><th>操作者</th><th>動作</th><th>對象</th><th>說明</th></tr></thead>
            <tbody id="audit-table"></tbody>
        </table>
    </div>
</div>
</div>
    </div>

    <!-- 重置密碼 Modal -->
    <div id="reset-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">重置密碼</div>
            <div id="reset-message" class="message"></div>
            
            <form onsubmit="handleResetPassword(event)">
                <div class="modal-body">
                    <p style="font-size: 12px; color: #34495e; margin-bottom: 12px;">
                        帳號：<span class="code" id="reset-account"></span>
                    </p>

                    <div class="form-group" style="margin-bottom: 12px;">
                        <label for="reset-password">新密碼 *</label>
                        <input type="password" id="reset-password" placeholder="輸入新密碼" required>
                    </div>

                    <div class="form-group">
                        <label for="reset-password-confirm">確認密碼 *</label>
                        <input type="password" id="reset-password-confirm" placeholder="再次輸入" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" onclick="closeResetModal()">取消</button>
                    <button type="submit" class="btn btn-reset">確認重置</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 編輯用戶與研究設定 Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">編輯用戶與音樂研究設定</div>
            
            <form onsubmit="handleEditUser(event)">
                <div class="modal-body">
                    <div class="form-group" style="margin-bottom: 10px;">
                      <label for="edit-tbi">TBI 帳號</label>
                      <input type="text" id="edit-tbi" placeholder="m1111 / c1111 / NA">
                    </div>
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label for="edit-name">姓名</label>
                        <input type="text" id="edit-name">
                    </div>
 
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label for="edit-password">新密碼（留空不變更）</label>
                        <input type="password" id="edit-password">
                    </div>

                    <!-- 🎵 音樂治療研究方案設定 -->
                    <div style="border-top: 1px solid #ecf0f1; margin: 16px 0; padding: 16px 0;">
                        <h4 style="font-size: 14px; color: #2c3e50; margin-bottom: 12px;">🧪 音樂治療研究方案設定</h4>

                        <div class="form-group" style="margin-bottom: 10px;">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold; color: #27ae60;">
                                <input type="checkbox" id="edit-is-study" style="width: 18px; height: 18px;" onchange="toggleStudyFields()">
                                <span>啟動音樂治療研究 (為期 3 個月)</span>
                            </label>
                        </div>

                        <!-- 研究細項設定 (勾選啟動後展開) -->
                        <div id="study-fields-group" style="display: none; background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 10px;">
                            <div class="form-group" style="margin-bottom: 8px;">
                                <label for="edit-study-start">研究開始日期</label>
                                <input type="date" id="edit-study-start">
                            </div>

                            <div class="form-group" style="margin-bottom: 8px;">
                                <label for="edit-study-duration">研究期程 (月)</label>
                                <input type="number" id="edit-study-duration" value="3" min="1" max="12">
                            </div>

                            <div class="form-group" style="margin-bottom: 10px;">
                                <label for="edit-music-mode">🎵 音樂顯示方式</label>
                                <select id="edit-music-mode" onchange="updateMusicOptionsVisibility()">
                                <option value="free">不限制（顯示全部音樂）</option>
                                <option value="locked">只顯示勾選的音樂</option>
                                </select>
                            </div>

                        <div id="music-options-group" style="display:none; background:#f8f9fa; padding:12px; border-radius:6px; border:1px solid #e2e8f0; margin-bottom:10px;">
                            <div id="music-options-list"></div>
                            <small style="color:#64748b;">全部不勾 = 此受試者看不到音樂區</small>
                        </div>
                    </div>

                        <!-- LINE 綁定與提醒開關 -->
                        <div class="form-group" style="margin-bottom: 10px;">
                            <label for="edit-line-userid">LINE User ID</label>
                            <input type="text" id="edit-line-userid" placeholder="例如：U123456789abcdef...">
                        </div>

                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" id="edit-send-reminder" checked style="width: 18px; height: 18px;">
                                <span>開啟每日 LINE 音樂與填寫提醒</span>
                            </label>
                        </div>
                    </div>
 
                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="edit-status" style="width: 18px; height: 18px;">
                            <span>停用此帳號</span>
                        </label>
                    </div>
                </div>
 
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" onclick="closeEditModal()">取消</button>
                    <button type="submit" class="btn btn-primary">儲存設定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 輔助切換研究詳細欄位顯示的 JavaScript 邏輯 -->
    <script>
        function toggleStudyFields() {
            const isChecked = document.getElementById('edit-is-study').checked;
            const group = document.getElementById('study-fields-group');
            group.style.display = isChecked ? 'block' : 'none';
        }
    </script>
    <script src="./account.js"></script>
</body>
</html>
