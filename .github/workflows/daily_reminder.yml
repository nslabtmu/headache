name: Daily Headache Reminder

on:
  schedule:
    # 台灣時間 21:00 = UTC 13:00 (冬令/夏令皆適用固定時差換算)
    - cron: '0 13 * * *'
  workflow_dispatch: # 讓您隨時可以在 GitHub 網頁手動點擊按鈕測試

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝套件
        run: |
          pip install requests supabase

      - name: 4. 執行提醒檢查腳本
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python reminder.py
