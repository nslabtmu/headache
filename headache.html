<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頭痛紀錄</title>
    <style>
        /* headache.html 專用的 CSS */
        body { margin: 0; padding: 15px; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card p-4">
    <h2 class="text-xl font-bold mb-3">⚡ 頭痛狀態紀錄</h2>
    
    <div class="mb-4">
        <label class="block font-medium mb-1">頭痛程度 (1-10 分): <span id="pain-val">5</span></label>
        <input type="range" id="input-pain" min="1" max="10" value="5" class="w-full" oninput="updateVal(this)">
    </div>

    <div class="mb-4">
        <label class="block font-medium mb-1">頭痛部位 (可複選):</label>
        <div class="flex flex-wrap gap-3">
            <label><input type="checkbox" name="pain_location" value="前額"> 前額</label>
            <label><input type="checkbox" name="pain_location" value="太陽穴"> 太陽穴</label>
            <label><input type="checkbox" name="pain_location" value="後腦勺"> 後腦勺</label>
            <label><input type="checkbox" name="pain_location" value="全頭"> 全頭</label>
        </div>
    </div>

    <div class="mb-4">
        <label class="block font-medium mb-1">是否用藥：</label>
        <select id="input-medication" onchange="toggleMedicationName()" class="border p-2 rounded w-full">
            <option value="">請選擇...</option>
            <option value="yes">是</option>
            <option value="no">否</option>
        </select>
        <input type="text" id="input-medication-name" placeholder="請輸入藥物名稱" style="display:none;" class="border p-2 rounded w-full mt-2">
    </div>

    <div class="mb-4">
        <label class="block font-medium mb-1">備註說明：</label>
        <textarea id="input-content" placeholder="其他狀況補充..." class="border p-2 rounded w-full"></textarea>
    </div>
</div>
    <script>
        // headache.html 的 JavaScript
        function toggleMedicationName() {
            const select = document.getElementById('input-medication');
            const input = document.getElementById('input-medication-name');
            input.style.display = select.value === 'yes' ? 'block' : 'none';
        }
    </script>
</body>
</html>
