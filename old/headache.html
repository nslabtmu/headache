<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頭痛紀錄</title>
    <style>
        /* headache.html 專用的 CSS */
        body { margin: 0; padding: 15px; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="form-group">
        <label for="input-pain">頭痛程度</label>
        <select id="input-pain">
            <option value="">請選擇疼痛程度...</option>
            <option value="1">1 分 - 輕微隱隱作痛</option>
            <option value="3">3 分 - 偶爾抽痛</option>
            <option value="5">5 分 - 中度疼痛，影響日常</option>
            <option value="7">7 分 - 重度疼痛，難以專注</option>
            <option value="10">10 分 - 劇烈疼痛，必須躺下休息</option>
        </select>
    </div>

    <div class="form-group">
        <label>頭痛部位（可複選）</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="pain_location" value="forehead"> 前額</label>
            <label><input type="checkbox" name="pain_location" value="temple_left"> 左太陽穴</label>
            <label><input type="checkbox" name="pain_location" value="temple_right"> 右太陽穴</label>
            <!-- ... 其他選項 ... -->
        </div>
    </div>

    <div class="form-group">
        <label for="input-medication">是否用藥</label>
        <select id="input-medication" onchange="toggleMedicationName()">
            <option value="no">否，未用藥</option>
            <option value="yes">是，已服用藥物</option>
        </select>
        <input type="text" id="input-medication-name" style="display:none; margin-top:8px;" placeholder="例如：普拿疼、Ibuprofen">
    </div>

    <div class="form-group">
        <label for="input-content">備註</label>
        <textarea id="input-content" rows="3" placeholder="例如：右側太陽穴抽痛..."></textarea>
    </div>

    <script>
        // headache.html 的 JavaScript
        function toggleMedicationName() {
            const select = document.getElementById('input-medication');
            const input = document.getElementById('input-medication-name');
            input.style.display = select.value === 'yes' ? 'block' : 'none';
        }
    </script>
</body>
</html>
